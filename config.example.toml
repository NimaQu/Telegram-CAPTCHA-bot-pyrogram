[bot]
username = "bot_username"
token = "123456:replace-me"
api_id = 123456
api_hash = "replace-me"
admin_ids = [123456789]
log_channel_id = -1001234567890

[database]
url = "sqlite+aiosqlite:///captcha.sqlite"
busy_timeout_ms = 30000

[web]
host = "127.0.0.1"
port = 5000
debug = false
trusted_proxy_cidrs = ["127.0.0.1/32", "::1/128"]
# Mini App 的公网 HTTPS 地址，留空时使用 turnstile.base_url
# public_url = "https://example.com"
# Mini App initData 的最长有效期（秒）
miniapp_init_data_ttl = 86400

[proxy]

[turnstile]
site_key = "replace-me"
secret_key = "replace-me"
base_url = "https://example.com"
verify_url = "https://challenges.cloudflare.com/turnstile/v0/siteverify"
timeout_seconds = 10.0

[geoip]
# 纯真 IP 库路径，用 `captcha-bot update-qqwry` 下载/更新；留空或文件不存在时不显示归属地
qqwry_path = "qqwry.dat"
download_url = "https://github.com/metowolf/qqwry.dat/releases/latest/download/qqwry.dat"

[antispam]
# 按群 AI 反垃圾（TypeSafe jev），各群管理员在配置面板里填写自己的 token
# 用于加密 token 的密钥，留空则不提供该功能；生成方式：python -c "import secrets; print(secrets.token_urlsafe(32))"
# 更换密钥后已保存的 token 都会失效，需要管理员重新填写
# secret_key = "replace-me"
api_url = "https://api.typesafe.ai/v1/systemone"
model = "jev-latest"
# 同时发送头像和消息图片（jev 的图片输入是实验功能）
send_images = true
timeout_seconds = 15.0
default_daily_limit = 500
test_hourly_limit = 30
# 调试用频道，送检的消息会先转发到这里，再回复 jev 的判断结果和解封按钮；Bot 需要是频道管理员
# debug_channel_id = -1001234567890

[defaults]
challenge_timeout = 60
challenge_timeout_action = "kick"
challenge_failed_action = "kick"
challenge_type = "math"
delete_passed_challenge = true
delete_passed_challenge_interval = 15
delete_failed_challenge = true
delete_failed_challenge_interval = 15
enable_global_blacklist = true
global_timeout_user_blacklist_remove = 600

[messages]
start_message = "喵？"
passed_answer = "#PASS\n用户: {targetuserid}\n群组 ID: {groupid}\n群组标题: {grouptitle}"
passed_admin = "#PASS_MANUALLY\n用户: {targetuserid}\n群组 ID: {groupid}\n群组标题: {grouptitle}"
failed_answer = "#FAIL_WRONG_ANSWER\n用户: {targetuserid}\n群组 ID: {groupid}\n群组标题: {grouptitle}"
failed_timeout = "#FAIL_TLO\n用户: {targetuserid}\n用户名: {targetusername}\nFirstname: {targetfirstname}\nLastname: {targetlastname}\n群组 ID: {groupid}\n群组标题: {grouptitle}"
failed_admin = "#FAIL_MANUALLY\n用户: {targetuserid}\n群组 ID: {groupid}\n群组标题: {grouptitle}"
failed_auto_kick = "#AUTO_KICKED\n用户: {targetuserid}\n用户名: {targetusername}\nFirstname: {targetfirstname}\nLastname: {targetlastname}\n群组 ID: {groupid}\n群组标题: {grouptitle}\n上次尝试: {lastattempt}\n间隔: {sincelastattempt}\n次数: {trycount}"
message_deleted = "#MESSAGE_DELETED\n用户: {targetuserid}\n消息: {messageid}\n群组 ID: {groupid}\n群组标题: {grouptitle}"
into_group = "#ADDBOT\n群组 ID: {groupid}\n群组标题: {grouptitle}"
leave_message = "根据 Term of Service，本 Bot 无法对该群组提供服务。"
self_introduction = "Telegram CAPTCHA Bot\nPowered by Kurigram"
challenge_not_for_you = "这次验证并不针对您"
challenge_math = "用户 {target_id}，请在 {timeout} 秒内回答：\n{challenge}"
challenge_math_private = "请在 {timeout} 秒内回答：\n{challenge}"
challenge_recaptcha = "用户 {target_id}，请在 {timeout} 秒内完成验证："
challenge_passed = "您已通过验证，欢迎加入本群！"
challenge_failed = "抱歉，您没有通过验证，如需解封请私聊本群群管。"
approve_manually = "人工通过 PASS"
refuse_manually = "人工拒绝 DENY"
permission_denied = "您的权限不足"
bot_no_permission = "操作失败，可能是群管并未赋予机器人管理员权限。"
approved = "您已被管理员 {user} 人工通过，欢迎加入本群！"
refused = "该用户已被管理员 {user} 移除出群。"
