[project]
name = "telegram-captcha-bot-pyrogram"
version = "1.0.0"
description = "An asynchronous Telegram CAPTCHA and moderation bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.139,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "kurigram>=2.2,<3",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.13,<3",
    "python-multipart>=0.0.22,<1",
    "sqlalchemy[asyncio]>=2.0.49,<3",
    "tgcrypto>=1.2.5,<2",
    "tomli-w>=1.2,<2",
    "uvicorn>=0.51,<1",
]

[project.scripts]
captcha-bot = "captcha_bot.cli:main"

[dependency-groups]
dev = [
    "pip-audit>=2.10,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "ty>=0.0.21,<1",
]

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_bot"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "captcha_bot/templates"
"static" = "captcha_bot/static"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
allowed-confusables = ["，", "。", "：", "；", "！", "？"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config --cov=src/captcha_bot --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = ["integration: requires a disposable PostgreSQL database"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["captcha_bot"]
